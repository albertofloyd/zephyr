# Core drivers
CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_PINCTRL=y

# Tachometer driver
CONFIG_TACH_XEC=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8048

# Console
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y

CONFIG_SENSOR_LOG_LEVEL_DBG=y

# Stack sizes
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Enable assertion for debugging
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
