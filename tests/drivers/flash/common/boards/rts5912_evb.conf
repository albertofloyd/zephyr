CONFIG_SPI=y
CONFIG_SPI_NOR=y
# Place the test area 2 sectors from the end of the 512 KB W25X40CL:
# 0x7e000 + 2 * 0x1000 (sectors) = 0x80000 = 512 KB = TEST_AREA_MAX
CONFIG_TEST_AREA_OFFSET=0x7e000
# flash_get_size() is not implemented by jedec,spi-nor; skip that sub-test
CONFIG_TEST_DRIVER_FLASH_SIZE=-1
