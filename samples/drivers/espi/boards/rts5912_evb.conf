# eSPI + rts5912_evb
CONFIG_ESPI=y
CONFIG_GPIO=y
# eSPI driver PM requires this
CONFIG_GPIO_GET_CONFIG=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100
# Disable only for this board to check notifications
CONFIG_ESPI_AUTOMATIC_WARNING_ACKNOWLEDGE=y
# Sample code doesn't handle ACPI host communication
CONFIG_ESPI_PERIPHERAL_HOST_IO=n
